<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Scholarship</title>
</head>
<body>

    <h1>Create Scholarship</h1>

    <p th:if="${errorMessage}"
       th:text="${errorMessage}"></p>

    <form th:action="@{/scholarships/create}" method="post">

        <label>Scholarship Name:</label>
        <input type="text" name="name" required>

        <label>Description:</label>
        <textarea name="description"></textarea>

        <label>Award Amount:</label>
        <input type="number" name="awardAmount"
               min="0.01" step="0.01" required>

        <label>Application Deadline:</label>
        <input type="datetime-local" name="deadline" required>

        <button type="submit">Create Scholarship</button>

    </form>

    <a th:href="@{/scholarships}">Back to Scholarships</a>

</body>
</html>
