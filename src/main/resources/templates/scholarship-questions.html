<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Scholarship Questions</title>
</head>
<body>

    <h1>Scholarship Questions</h1>

    <h2>Add a Question</h2>

    <form th:action="@{/scholarships/{id}/questions(id=${scholarshipId})}"
          method="post">

        <label>Question:</label>
        <input type="text" name="questionText" required>

        <label>Required?</label>
        <input type="checkbox" name="required" value="true">

        <label>Input Type:</label>
        <select name="inputType">
            <option value="TEXT">Text</option>
            <option value="NUMBER">Number</option>
        </select>

        <button type="submit">Add Question</button>
    </form>

    <hr>

    <h2>Saved Questions</h2>

    <p th:if="${#lists.isEmpty(questions)}">
        No questions have been added yet.
    </p>

    <ul>
        <li th:each="question : ${questions}">

            <span th:text="${question.questionText}"></span>

            (<span th:text="${question.required ? 'Required' : 'Optional'}"></span>)

            - <span th:text="${question.inputType}"></span>

        </li>
    </ul>

    <a th:href="@{/scholarships/{id}(id=${scholarshipId})}">
        Back to Scholarship
    </a>

</body>
</html>
