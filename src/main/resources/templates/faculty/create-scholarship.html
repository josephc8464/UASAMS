<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UASAMS - Create Scholarship</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/faculty/scholarships}">UASAMS | Faculty Portal</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/faculty/scholarships}">&larr; Back to Scholarships</a>
    </div>
</nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Validation Error Message -->
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
                Error creating scholarship
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0">Create New Scholarship</h4>
                    <small class="text-muted">Scholarships are created as Drafts unless specified otherwise. Custom application questions can be configured on the next screen.</small>
                </div>
                <div class="card-body">
                    <form th:action="@{/faculty/scholarships/create}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Scholarship Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name"
                                   th:value="${name}" required placeholder="e.g., Dean's Engineering Excellence Award">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Description &amp; Eligibility Criteria</label>
                            <textarea class="form-control" id="description" name="description" rows="4"
                                      th:text="${description}"
                                      placeholder="Provide details on purpose, criteria, and applicant expectations..."></textarea>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="awardAmount" class="form-label fw-semibold">Award Amount ($) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" min="0" class="form-control" id="awardAmount"
                                       name="awardAmount" th:value="${awardAmount}" required placeholder="2500.00">
                            </div>
                            <div class="col-md-6">
                                <label for="deadline" class="form-label fw-semibold">Application Deadline <span class="text-danger">*</span></label>
                                <input type="datetime-local" class="form-control" id="deadline" name="deadline"
                                       th:value="${deadline != null ? #temporals.format(deadline, 'yyyy-MM-dd''T''HH:mm') : ''}"
                                       required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-8">
                                <label for="providerContact" class="form-label fw-semibold">Provider / Coordinator Contact</label>
                                <input type="text" class="form-control" id="providerContact" name="providerContact"
                                       th:value="${providerContact}" placeholder="coordinator@arizona.edu or Sponsor Name">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Eligible Majors</label>
                            <div class="border rounded p-3 bg-white" style="max-height: 220px; overflow-y: auto;">
                                <div class="row">
                                    <div class="col-md-6" th:each="m : ${majors}">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox"
                                                   name="eligibleMajors"
                                                   th:id="${'major_' + m.name()}"
                                                   th:value="${m.name()}"
                                                   th:checked="${selectedMajors != null and #sets.contains(selectedMajors, m)}">
                                            <label class="form-check-label small"
                                                   th:for="${'major_' + m.name()}"
                                                   th:text="${m.toString()}">Major Name</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-text">Select one or more eligible engineering majors.</div>
                        </div>

                        <div class="mb-4">
                            <label for="disbursementInstructions" class="form-label fw-semibold">Disbursement Instructions</label>
                            <textarea class="form-control" id="disbursementInstructions" name="disbursementInstructions" rows="3"
                                      th:text="${disbursementInstructions}"
                                      placeholder="Explain how and when funds are disbursed (e.g., split across Fall/Spring tuition)..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/faculty/scholarships}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Create Scholarship &amp; Configure Questions</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
