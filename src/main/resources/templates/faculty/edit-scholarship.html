<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'UASAMS - Edit ' + scholarship.name}">UASAMS - Edit Scholarship</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/faculty/scholarships}">UASAMS | Faculty Portal</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/faculty/scholarships}">&larr; All Scholarships</a>
    </div>
</nav>

<div class="container mb-5" th:with="isDraft=${scholarship.status.name() == 'DRAFT'}">
    <!-- Flash Feedback Alerts -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Header & Lifecycle Controls -->
    <div class="card shadow-sm mb-4">
        <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <div class="d-flex align-items-center gap-2">
                    <h3 class="mb-0" th:text="${scholarship.name}">Scholarship Name</h3>
                    <span class="badge"
                          th:classappend="${scholarship.status.name() == 'OPEN'} ? 'bg-success' :
                                          (${isDraft} ? 'bg-warning text-dark' :
                                          (${scholarship.status.name() == 'CLOSED'} ? 'bg-danger' : 'bg-dark'))"
                          th:text="${scholarship.status.toString()}">DRAFT</span>
                </div>
                <small class="text-muted" th:text="${'Scholarship ID: #' + scholarship.id}">ID: #1</small>
            </div>

            <!-- Lifecycle Action Forms -->
            <div class="d-flex flex-wrap gap-2">
                <form th:if="${isDraft}"
                      th:action="@{/faculty/scholarships/{id}/publish(id=${scholarship.id})}"
                      method="post">
                    <button type="submit" class="btn btn-success">Publish Scholarship</button>
                </form>

                <form th:if="${scholarship.status.name() == 'OPEN'}"
                      th:action="@{/faculty/scholarships/{id}/close(id=${scholarship.id})}"
                      method="post">
                    <button type="submit" class="btn btn-warning">Close Applications</button>
                </form>

                <form th:if="${scholarship.status.name() == 'CLOSED'}"
                      th:action="@{/faculty/scholarships/{id}/archive(id=${scholarship.id})}"
                      method="post">
                    <button type="submit" class="btn btn-dark"
                            onclick="return confirm('Archive this scholarship? Archived scholarships are retired from active cycles.');">
                        Archive Scholarship
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Left Column: Edit Scholarship Details -->
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Scholarship Details</h5>
                    <span th:unless="${isDraft}" class="badge bg-secondary">Read-only (Not in Draft)</span>
                </div>
                <div class="card-body">
                    <form th:action="@{/faculty/scholarships/{id}/update(id=${scholarship.id})}" method="post">
                        <fieldset th:disabled="${!isDraft}">
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">Scholarship Name</label>
                                <input type="text" class="form-control" id="name" name="name"
                                       th:value="${scholarship.name}" required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label fw-semibold">Description &amp; Eligibility Criteria</label>
                                <textarea class="form-control" id="description" name="description" rows="4"
                                          th:text="${scholarship.description}"></textarea>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="awardAmount" class="form-label fw-semibold">Award Amount ($)</label>
                                    <input type="number" step="0.01" min="0" class="form-control" id="awardAmount"
                                           name="awardAmount" th:value="${scholarship.awardAmount}" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="deadline" class="form-label fw-semibold">Application Deadline</label>
                                    <input type="datetime-local" class="form-control" id="deadline" name="deadline"
                                           th:value="${scholarship.deadline != null ? #temporals.format(scholarship.deadline, 'yyyy-MM-dd''T''HH:mm') : ''}"
                                           required>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-8">
                                    <label for="providerContact" class="form-label fw-semibold">Provider Contact</label>
                                    <input type="text" class="form-control" id="providerContact" name="providerContact"
                                           th:value="${scholarship.providerContact}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Eligible Majors</label>
                                <div class="border rounded p-3 bg-white" style="max-height: 220px; overflow-y: auto;">
                                    <div class="row">
                                        <div class="col-md-6" th:each="m : ${majors}">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox"
                                                       name="eligibleMajors"
                                                       th:id="${'edit_major_' + m.name()}"
                                                       th:value="${m.name()}"
                                                       th:checked="${scholarship.eligibleMajors != null and #sets.contains(scholarship.eligibleMajors, m)}">
                                                <label class="form-check-label small"
                                                       th:for="${'edit_major_' + m.name()}"
                                                       th:text="${m.toString()}">Major Name</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="disbursementInstructions" class="form-label fw-semibold">Disbursement Instructions</label>
                                <textarea class="form-control" id="disbursementInstructions" name="disbursementInstructions" rows="3"
                                          th:text="${scholarship.disbursementInstructions}"></textarea>
                            </div>

                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary" th:disabled="${!isDraft}">Save Changes</button>
                            </div>
                        </fieldset>
                    </form>
                </div>
            </div>
        </div>

        <!-- Right Column: Custom Application Questions -->
        <div class="col-lg-5">
            <!-- Add Question Form -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Add Application Question</h5>
                    <span th:unless="${isDraft}" class="badge bg-secondary">Locked</span>
                </div>
                <div class="card-body">
                    <form th:action="@{/faculty/scholarships/{id}/questions/add(id=${scholarship.id})}" method="post">
                        <fieldset th:disabled="${!isDraft}">
                            <div class="mb-3">
                                <label for="prompt" class="form-label fw-semibold">Question Prompt <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="prompt" name="prompt" rows="2" required
                                          placeholder="e.g., Describe your senior capstone project or engineering research experience."></textarea>
                            </div>

                            <div class="row g-3 align-items-center mb-3">
                                <div class="col-sm-7">
                                    <label for="inputType" class="form-label fw-semibold">Response Input Type</label>
                                    <select class="form-select" id="inputType" name="inputType">
                                        <option th:each="type : ${inputTypes}"
                                                th:value="${type.name()}"
                                                th:text="${type.toString()}">Text</option>
                                    </select>
                                </div>
                                <div class="col-sm-5 pt-sm-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="required" name="required" value="true">
                                        <label class="form-check-label fw-semibold" for="required">Required</label>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-outline-primary w-100" th:disabled="${!isDraft}">+ Add Question</button>
                        </fieldset>
                    </form>
                </div>
            </div>

            <!-- Existing Questions List -->
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Configured Questions</h5>
                    <span class="badge bg-secondary" th:text="${#lists.size(questions)}">0</span>
                </div>
                <div class="list-group list-group-flush">
                    <div th:if="${#lists.isEmpty(questions)}" class="list-group-item text-muted text-center py-4">
                        No custom questions added yet.
                    </div>
                    <div th:each="q, iterStat : ${questions}"
                         class="list-group-item d-flex justify-content-between align-items-start gap-2">
                        <div>
                            <div class="fw-semibold">
                                <span th:text="${iterStat.count + '. '}">1. </span>
                                <span th:text="${q.questionText}">Question text</span>
                            </div>
                            <div class="mt-1">
                                <span class="badge bg-info text-dark" th:text="${q.inputType.toString()}">Text</span>
                                <span th:if="${q.required}" class="badge bg-danger ms-1">Required</span>
                                <span th:unless="${q.required}" class="badge bg-light text-dark border ms-1">Optional</span>
                            </div>
                        </div>
                        <form th:action="@{/faculty/scholarships/{sId}/questions/{qId}/delete(sId=${scholarship.id}, qId=${q.id})}"
                              method="post">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    th:disabled="${!isDraft}"
                                    onclick="return confirm('Delete this question?');">
                                Remove
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
