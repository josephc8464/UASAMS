<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>UASAMS - Create Account</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; margin-top: 40px; background: #f4f6f8; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 360px; }
        input { width: 100%; padding: 10px; margin: 6px 0 14px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0c234b; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .msg-error { color: #b00020; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Create Account</h2>

    <div th:if="${error}" th:text="${error}" class="msg-error"></div>

    <form th:action="@{/signup}" method="post">
        <label>First Name</label>
        <input type="text" name="firstName" required />

        <label>Last Name</label>
        <input type="text" name="lastName" required />

        <label>Username</label>
        <input type="text" name="username" required />

        <label>Email</label>
        <input type="email" name="email" required />

        <label>Password</label>
        <input type="password" name="password" required />

        <button type="submit">Sign Up</button>
    </form>

    <p style="margin-top: 16px; text-align: center;">
        Already have an account? <a th:href="@{/login}">Sign In</a>
    </p>
</div>
</body>
</html>
